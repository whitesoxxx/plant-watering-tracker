<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ears (pointed, upright — classic westie) -->
  <polygon points="22,52 30,16 44,46" fill="#f0f0f0" stroke="#c4c4c4" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="78,52 70,16 56,46" fill="#f0f0f0" stroke="#c4c4c4" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner ear -->
  <polygon points="26,49 32,23 41,45" fill="#e0a888"/>
  <polygon points="74,49 68,23 59,45" fill="#e0a888"/>

  <!-- Fluffy head — layered circles for fur effect -->
  <circle cx="36" cy="36" r="15" fill="#f4f4f4"/>
  <circle cx="50" cy="30" r="14" fill="#f4f4f4"/>
  <circle cx="64" cy="36" r="15" fill="#f4f4f4"/>
  <circle cx="50" cy="57" r="30" fill="#f4f4f4"/>
  <circle cx="26" cy="53" r="12" fill="#f4f4f4"/>
  <circle cx="74" cy="53" r="12" fill="#f4f4f4"/>

  <!-- Eyebrow fur tufts (very westie) -->
  <path d="M28 46 Q36 40 44 45" stroke="#c0c0c0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M56 45 Q64 40 72 46" stroke="#c0c0c0" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="37" cy="55" r="7" fill="#1a1a1a"/>
  <circle cx="63" cy="55" r="7" fill="#1a1a1a"/>
  <!-- Shine -->
  <circle cx="40" cy="52" r="2.5" fill="white"/>
  <circle cx="66" cy="52" r="2.5" fill="white"/>

  <!-- Nose -->
  <ellipse cx="50" cy="68" rx="9" ry="7" fill="#111"/>
  <ellipse cx="47" cy="65.5" rx="3" ry="1.8" fill="#444"/>

  <!-- Mouth -->
  <path d="M43 75 Q50 82 57 75" stroke="#aaa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="50" y1="75" x2="50" y2="68" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
</svg>
